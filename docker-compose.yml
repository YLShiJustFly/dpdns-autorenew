services:
  dpdns-renew:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim-bookworm}
    image: dpdns-renew:latest
    container_name: dpdns-renew
    environment:
      - EMAIL=${DPDNS_EMAIL}
      - PASSWORD=${DPDNS_PASSWORD}
      - DOMAIN=${DPDNS_DOMAIN}
      - DRY_RUN=${DRY_RUN:-false}
      - AUTO_MODE=false
      - TZ=Asia/Shanghai
      - DISPLAY=:99
    volumes:
      - ./config:/config
    shm_size: 2gb
    restart: "no"
